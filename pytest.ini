[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    allow_network: let the test reach the real network (default: every requests call raises ConnectionError)
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:google.*
    ignore::pytest.PytestUnknownMarkWarning
    ignore:.*missing ScriptRunContext.*
    ignore:.*No runtime found.*
    ignore:.*Session state does not function.*
    ignore:.*st\.cache_.* was called without a runtime.*
