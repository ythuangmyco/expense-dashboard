# Streamlit Secrets Template
# Copy this to .streamlit/secrets.toml and fill in your values

# Optional: secret used to sign the "記住我" login cookie (expense_auth).
# Set it so logins survive redeploys; changing it logs everyone out.
# NOTE: this is a TOP-LEVEL key -- it must stay ABOVE the first [section]
# header (TOML assigns any key written below [app] to the [app] table).
# AUTH_COOKIE_SECRET = "change-me-long-random"

[google_sheets]
type = "service_account"
project_id = "your-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY_HERE\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project-id.iam.gserviceaccount.com"
client_id = "your-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project-id.iam.gserviceaccount.com"

[app]
sheet_id = "your-actual-google-sheet-id-here"
# Optional: worksheet (tab) GID; defaults to config.WORKSHEET_GID. Point this at a copy to rehearse.
# worksheet_gid = 453361449
